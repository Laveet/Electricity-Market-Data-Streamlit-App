name: Daily Energy Data Ingestion Pipeline

on:
  schedule:
    # Runs daily at 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Daily Data Ingestion Script
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          python scripts/daily_ingestion.py

      - name: Commit and Push Updated Data Store
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git status
          git diff-index --quiet HEAD || git commit -m "auto: daily lakehouse parquet update [skip ci]"
          git push